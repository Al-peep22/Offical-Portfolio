<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./num.css" />
    <script src="./num.js"></script>
</head>
<body>
    <div class="HLOptions">
        <div class="HLDifficulty">
            <!-- difficulty levels -->
            <h3>Difficulty</h3>
            <button onclick="setDifficulty('Easy')">Easy</button>
            <button onclick="setDifficulty('Medium')">Medium</button>
            <button onclick="setDifficulty('Hard')">Hard</button>
        </div>
        <div>
            <!-- limit guesses -->
            <h3>Limited Guesses</h3>
            <button onclick="setGuessLimit('On')">On</button>
            <button onclick="setGuessLimit('Off')">Off</button>
        </div>
        <button onclick="showInstructions(0)">Show Instructions</button>
        <div>
            <button onclick="goHome()">Back</button>
            <button onclick="startHLGame();">Play</button>
        </div>
    </div>
    <div class="HLGame">
        <div class="HLMenu">
            <button onclick="showInstructions(0)">Help</button>
            <button onclick="resetHLGame()">Reset</button>
            <button onclick="exitHLGame()">Exit</button>
        </div>
        <div class="HLGameDisplay">
            <p class="HLGameText">Guess a number between 1 and 100</p>
            <input type="number" id="HLGuessInput" placeholder="Enter your guess" />
            <button onclick="submitHLGuess()">Submit Guess</button>
            <p class="HLFeedback"></p>
        </div>
    </div>
    <div class="GamePopUp">
        <p class="Instructions"></p>
        <button onclick="closePopUp('GamePopUp')">Close</button>
    </div>
    <footer>
        <p>&copy; 2026 Projects Portfolio By Alison Waldsmith</p>
    </footer>
</body>
</html>
