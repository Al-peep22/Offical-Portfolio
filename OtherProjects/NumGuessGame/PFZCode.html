<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="./num.css" />
    <script src="./num.js"></script>
</head>
<body>
<div class="PFZOptions">
    <h2 class="PFZTitle">PFZ Code</h2>

    <!-- Difficulty Selection -->
    <div class="PFZDifficulty">
        <h3>Difficulty</h3>
        <button id="diffEasy" onclick="selectDifficulty('Easy')">Easy</button>
        <button id="diffMedium" onclick="selectDifficulty('Medium')">Medium</button>
        <button id="diffHard" onclick="selectDifficulty('Hard')">Hard</button>
    </div>

    <!-- Guess Limit Toggle -->
    <div class="PFZLimit">
        <h3>Limited Guesses</h3>
        <button id="limitOn" onclick="selectGuessLimit('On')">On</button>
        <button id="limitOff" onclick="selectGuessLimit('Off')">Off</button>
    </div>

    <!-- Instructions -->
    <button class="PFZInstructionsBtn" onclick="showInstructions(1)">How to Play</button>

    <!-- Navigation -->
    <div class="PFZNav">
        <button onclick="goHome()">Back</button>
        <button onclick="generatePFZCode();">Play</button>
    </div>
</div>

<!-- GAME SCREEN -->
<div class="PFZGame">
    <div class="PFZMenu">
        <button onclick="showInstructions(1)">Help</button>
        <button onclick="resetPFZGame()">Reset</button>
        <button onclick="goHome()">Exit</button>
    </div>

    <div class="PFZGameDisplay">
        <p class="PFZGameText">Enter your code guess:</p>
        <input type="text" id="PFZGuessInput" placeholder="Enter code" />
        <button onclick="submitPFZGuess()">Submit Guess</button>
        <p class="PFZFeedback"></p>
    </div>
</div>

<!-- POPUP -->
<div class="GamePopUp">
    <p class="Instructions"></p>
    <button onclick="closePopUp('GamePopUp')">Close</button>
</div>
</body>
